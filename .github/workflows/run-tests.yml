name: Tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: expodemo-run-tests-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --registry=https://registry.npmjs.org --no-audit --no-fund

      - name: Unit Tests
        run: npx jest --ci

  integration-android:
    name: Integration (android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPORT_PLATFORMS: |
        ios
        android
      ANDROID_ARCHITECTURES: x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --registry=https://registry.npmjs.org --no-audit --no-fund

      - name: Export JS bundles
        run: |
          set -euo pipefail
          IFS=$'\n'
          args=()
          for platform in $EXPORT_PLATFORMS; do
            args+=(--platform "$platform")
          done
          npx expo export "${args[@]}" --output-dir "$RUNNER_TEMP/export"

      # The debug signing config expects android/app/test.jks; both files are gitignored.
      - name: Write CI-only Firebase config and keystore
        run: |
          set -euo pipefail
          cp ci/fixtures/google-services.json android/app/google-services.json
          keytool -genkeypair -keystore android/app/test.jks -alias test \
            -storepass 123456 -keypass 123456 -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI Throwaway"

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures="$ANDROID_ARCHITECTURES"

  integration-ios:
    name: Integration (ios)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SCHEME: ExpoDemo
      DESTINATION: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --registry=https://registry.npmjs.org --no-audit --no-fund

      - name: Install pods
        working-directory: ios
        run: |
          set -euo pipefail
          command -v pod >/dev/null || sudo gem install cocoapods
          pod install

      - name: Build for simulator
        working-directory: ios
        run: |
          xcodebuild build \
            -workspace ExpoDemo.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO

  integration-tests:
    name: Integration Tests
    needs:
      - integration-android
      - integration-ios
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: |
        integration-android=${{ needs.integration-android.result }}
        integration-ios=${{ needs.integration-ios.result }}
    steps:
      - name: Integration Tests
        run: |
          set -euo pipefail
          IFS=$'\n'
          status=0
          for result in $RESULTS; do
            echo "$result"
            [ "${result#*=}" = success ] || status=1
          done
          exit "$status"
